name: Publish Docker image

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: muhdidhamm/cybertool-mcp-server
  BUILDX_CACHE_DIR: /tmp/.buildx-cache
  BUILDX_CACHE_NEW_DIR: /tmp/.buildx-cache-new

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Clean previous workspace
        shell: bash
        run: |
          sudo mkdir -p "${{ github.workspace }}"
          sudo find "${{ github.workspace }}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host
          buildkitd-flags: --debug

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=${{ env.BUILDX_CACHE_DIR }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE_NEW_DIR }},mode=min

      - name: Move Buildx local cache
        if: always()
        shell: bash
        run: |
          if [ -d "${{ env.BUILDX_CACHE_NEW_DIR }}" ]; then
            rm -rf "${{ env.BUILDX_CACHE_DIR }}"
            mv "${{ env.BUILDX_CACHE_NEW_DIR }}" "${{ env.BUILDX_CACHE_DIR }}"
          fi

      - name: Show Docker disk usage
        if: always()
        shell: bash
        run: |
          docker system df || true